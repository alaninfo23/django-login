{% extends "assets/base.html" %}
{% block title %}Deletar Bem{% endblock %}
{% block content %}
<div style="background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.1); max-width:480px; margin:0 auto;">
    <h1 style="margin-bottom:1rem;">Confirmar Exclusão</h1>
    <p style="margin-bottom:1.5rem;">Tem certeza que deseja deletar <strong>{{ asset.name }}</strong>? Esta ação não pode ser desfeita.</p>
    <form method="post" style="display:flex; gap:.75rem;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sim, deletar</button>
        <a href="{% url 'asset_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
