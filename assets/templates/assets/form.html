{% extends "assets/base.html" %}
{% block title %}{% if asset %}Editar{% else %}Novo{% endif %} Bem{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">{% if asset %}Editar Bem{% else %}Novo Bem{% endif %}</h1>

<form method="post" style="background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.1); max-width:560px;">
    {% csrf_token %}
    <style>
        .field { margin-bottom:1.2rem; }
        label { display:block; font-size:.875rem; font-weight:600; margin-bottom:.3rem; }
        input, select, textarea { width:100%; padding:.6rem .8rem; border:1px solid #d1d5db; border-radius:4px; font-size:1rem; }
        textarea { resize:vertical; height:80px; }
    </style>

    <div class="field">
        <label>Nome *</label>
        <input type="text" name="name" value="{{ asset.name|default:'' }}" required>
    </div>
    <div class="field">
        <label>Tipo *</label>
        <select name="asset_type" required>
            {% for val, label in asset_types.choices %}
            <option value="{{ val }}" {% if asset.asset_type == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label>Valor de Aquisição (R$) *</label>
        <input type="number" name="acquisition_value" step="0.01" min="0" value="{{ asset.acquisition_value|default:'' }}" required>
    </div>
    <div class="field">
        <label>Data de Compra</label>
        <input type="date" name="purchase_date" value="{{ asset.purchase_date|default:'' }}">
    </div>
    <div class="field">
        <label>Status *</label>
        <select name="status" required>
            {% for val, label in statuses.choices %}
            <option value="{{ val }}" {% if asset.status == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label>Localização</label>
        <input type="text" name="location" value="{{ asset.location|default:'' }}">
    </div>
    <div class="field">
        <label>Observações</label>
        <textarea name="notes">{{ asset.notes|default:'' }}</textarea>
    </div>

    <div style="display:flex; gap:.75rem;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'asset_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
