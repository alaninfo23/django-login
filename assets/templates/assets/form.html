{% extends "assets/base.html" %}
{% load asset_filters %}
{% block title %}{% if asset %}Editar{% else %}Novo{% endif %} Bem{% endblock %}
{% block content %}
<h1 style="margin-bottom:1.5rem;">{% if asset %}Editar Bem{% else %}Novo Bem{% endif %}</h1>

<form method="post" style="background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.1); max-width:560px; margin:0 auto;">
    {% csrf_token %}
    <style>
        .field { margin-bottom:1.2rem; }
        label { display:block; font-size:.875rem; font-weight:600; margin-bottom:.3rem; }
        input, select, textarea { width:100%; padding:.6rem .8rem; border:1px solid #d1d5db; border-radius:4px; font-size:1rem; }
        textarea { resize:vertical; height:80px; }
    </style>

    <div class="field">
        <label>Nome *</label>
        <input type="text" name="name" value="{{ asset.name|default:'' }}" required>
    </div>
    <div class="field">
        <label>Tipo *</label>
        <select name="asset_type" required>
            {% for val, label in asset_types.choices %}
            <option value="{{ val }}" {% if asset.asset_type == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label>Valor de Aquisição (R$) *</label>
        <input type="text" id="acquisition_value_display" placeholder="0,00"
               value="{% if asset.acquisition_value %}{{ asset.acquisition_value|brl }}{% endif %}"
               inputmode="numeric" required>
        <input type="hidden" name="acquisition_value" id="acquisition_value">
    </div>
    <div class="field">
        <label>Data de Compra</label>
        <input type="date" name="purchase_date" value="{{ asset.purchase_date|default:'' }}">
    </div>
    <div class="field">
        <label>Status *</label>
        <select name="status" required>
            {% for val, label in statuses.choices %}
            <option value="{{ val }}" {% if asset.status == val %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label>Localização</label>
        <input type="text" name="location" value="{{ asset.location|default:'' }}">
    </div>
    <div class="field">
        <label>Observações</label>
        <textarea name="notes">{{ asset.notes|default:'' }}</textarea>
    </div>

    <div style="display:flex; gap:.75rem;">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a href="{% url 'asset_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>

<script>
const display = document.getElementById('acquisition_value_display');
const hidden  = document.getElementById('acquisition_value');

function formatBRL(val) {
    val = val.replace(/\D/g, '');
    if (!val) return '';
    val = (parseInt(val) / 100).toFixed(2);
    const [int, dec] = val.split('.');
    return int.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + dec;
}

function toDecimal(val) {
    return val.replace(/\./g, '').replace(',', '.');
}

display.addEventListener('input', () => {
    display.value = formatBRL(display.value);
});

display.closest('form').addEventListener('submit', () => {
    hidden.value = toDecimal(display.value);
});

// init hidden on load (edit mode)
if (display.value) hidden.value = toDecimal(display.value);
</script>
{% endblock %}
