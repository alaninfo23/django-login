<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meus Bens{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f2f5; color: #333; }
        nav { background: #4f46e5; padding: .8rem 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
        nav a { color: white; text-decoration: none; font-size: .95rem; }
        nav a:hover { text-decoration: underline; }
        .nav-links { display: flex; gap: 1rem; flex-wrap: wrap; }
        .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
        h1 { margin-bottom: 1.5rem; font-size: 1.4rem; }
        .btn { display: inline-block; padding: .5rem 1rem; border-radius: 4px; text-decoration: none; font-size: .9rem; cursor: pointer; border: none; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-danger  { background: #dc2626; color: white; }
        .btn-danger:hover  { background: #b91c1c; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #4b5563; }

        .dropdown { position: relative; }
        .dropdown-btn { background: none; border: none; color: white; cursor: pointer; font-size: .95rem; padding: 0; }
        .dropdown-btn:hover { text-decoration: underline; }
        .dropdown-menu { display: none; position: absolute; right: 0; top: 1.8rem;
            background: white; border: 1px solid #ddd; border-radius: 6px;
            box-shadow: 0 4px 12px rgba(0,0,0,.15); min-width: 160px; z-index: 100; overflow: hidden; }
        .dropdown-menu.open { display: block; }
        .dropdown-menu a,
        .dropdown-menu button { display: block; width: 100%; padding: .6rem 1rem; text-align: left;
            background: none; border: none; font-size: .9rem; color: #333; cursor: pointer;
            text-decoration: none; box-sizing: border-box; }
        .dropdown-menu a:hover,
        .dropdown-menu button:hover { background: #f5f5f5; }
        .dropdown-menu button { color: #dc2626; }
    </style>
</head>
<body>
<script>
    document.addEventListener('click', function(e) {
        const btn = e.target.closest('.dropdown-btn');
        const menu = document.querySelector('.dropdown-menu');
        if (btn) { menu.classList.toggle('open'); }
        else if (!e.target.closest('.dropdown-menu')) { menu.classList.remove('open'); }
    });
</script>
</head>
<body>
<nav>
    <div class="nav-links">
        <a href="{% url 'asset_list' %}">📦 Meus Bens</a>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
    </div>
    <div class="dropdown">
        <button class="dropdown-btn">{{ user.username }} ▾</button>
        <div class="dropdown-menu">
            <a href="{% url 'password_change' %}">Alterar senha</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
        </div>
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
