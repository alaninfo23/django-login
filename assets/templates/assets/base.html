<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Meus Bens{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background: #f0f2f5; color: #333; }
        nav { background: #4f46e5; padding: .8rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; font-size: .95rem; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h1 { margin-bottom: 1.5rem; }
        .btn { display: inline-block; padding: .5rem 1rem; border-radius: 4px; text-decoration: none; font-size: .9rem; cursor: pointer; border: none; }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-primary:hover { background: #4338ca; }
        .btn-danger  { background: #dc2626; color: white; }
        .btn-danger:hover  { background: #b91c1c; }
        .btn-secondary { background: #6b7280; color: white; }
        .btn-secondary:hover { background: #4b5563; }
    </style>
</head>
<body>
<nav>
    <div style="display:flex; gap:1.5rem;">
        <a href="{% url 'asset_list' %}">📦 Meus Bens</a>
        <a href="{% url 'dashboard' %}">📊 Dashboard</a>
    </div>
    <a href="{% url 'logout' %}">Sair ({{ user.username }})</a>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
