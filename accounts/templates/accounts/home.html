<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); text-align: center; }
        h2 { color: #333; margin-bottom: 1rem; }
        a { color: #4f46e5; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>Olá, {{ user.username }}! 👋</h2>
    <p>Você está logado.</p>
    <br>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" style="background:none;border:none;color:#4f46e5;cursor:pointer;font-size:1rem;padding:0;">Sair</button>
    </form>
</div>
</body>
</html>
