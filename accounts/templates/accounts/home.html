<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); text-align: center; }
        h2 { color: #333; margin-bottom: 1rem; }

        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background: none; border: none; color: #4f46e5; cursor: pointer; font-size: 1rem; padding: 0; }
        .dropdown-btn:hover { text-decoration: underline; }
        .dropdown-menu { display: none; position: absolute; top: 1.6rem; left: 50%; transform: translateX(-50%);
            background: white; border: 1px solid #ddd; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.1);
            min-width: 160px; z-index: 10; overflow: hidden; }
        .dropdown:hover .dropdown-menu { display: block; }
        .dropdown-menu a,
        .dropdown-menu button { display: block; width: 100%; padding: .6rem 1rem; text-align: left;
            background: none; border: none; font-size: .95rem; color: #333; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .dropdown-menu a:hover,
        .dropdown-menu button:hover { background: #f5f5f5; }
        .dropdown-menu button { color: #dc2626; }
    </style>
</head>
<body>
<div class="card">
    <h2>Olá! 👋</h2>
    <p>Você está logado.</p>
    <br>
    <div class="dropdown">
        <button class="dropdown-btn">{{ user.username }} ▾</button>
        <div class="dropdown-menu">
            <a href="{% url 'password_change' %}">Alterar senha</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
