{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: url("{% static 'accounts/fundo_login.png' %}") center/cover no-repeat; padding: 1rem; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 100%; max-width: 360px; }
        h2 { margin-bottom: 1.5rem; text-align: center; color: #333; }
        input { width: 100%; padding: .6rem .8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { width: 100%; padding: .7rem; background: #4f46e5; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #4338ca; }
        .error { color: #dc2626; font-size: .875rem; margin-bottom: 1rem; }
        .brand { text-align: center; margin-bottom: 1.2rem; font-family: 'Georgia', serif; font-size: 1.6rem; letter-spacing: 1px; }
        .brand .gestao { color: #cc0000; font-weight: bold; }
        .brand .patrimonial { color: #6b7280; font-weight: normal; }
    </style>
</head>
<body>
<div class="card">
    <div class="brand">
        <span class="gestao">Gestão</span> <span class="patrimonial">Patrimonial</span>
    </div>
    <img src="{% static 'accounts/logo_pp.png' %}" alt="Logo" style="display:block;width:100%;margin-bottom:1.5rem;">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="Usuário" required autofocus>
        <input type="password" name="password" placeholder="Senha" required>
        <button type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
