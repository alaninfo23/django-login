{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SGP - Senha Redefinida</title>
  <link rel="icon" type="image/png" href="{% static 'accounts/logo_pp.png' %}">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;
      background:url("{% static 'accounts/fundo_login.png' %}") center/cover no-repeat;padding:1rem;}
    body::before{content:'';position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:0;}
    .card{position:relative;z-index:1;background:#a1a1a1;padding:2.2rem 2rem;border-radius:14px;
      box-shadow:0 8px 32px rgba(0,0,0,.35);width:100%;max-width:370px;text-align:center;}
    .logo{display:block;width:100%;margin-bottom:.8rem;}
    .icon{font-size:2.5rem;margin-bottom:.8rem;}
    h2{font-size:1.15rem;color:#1f2937;margin-bottom:.6rem;}
    p{font-size:.88rem;color:#374151;margin-bottom:1.2rem;}
    a.btn{display:inline-block;padding:.7rem 2rem;background:linear-gradient(135deg,#4f46e5,#7c3aed);
      color:white;border-radius:7px;text-decoration:none;font-weight:600;font-size:.97rem;transition:opacity .2s;}
    a.btn:hover{opacity:.9;}
  </style>
</head>
<body>
<div class="card">
  <img src="{% static 'accounts/logo_pp.png' %}" alt="Logo SGP" class="logo"/>
  <div class="icon">✅</div>
  <h2>Senha redefinida com sucesso!</h2>
  <p>Sua nova senha foi salva. Você já pode fazer login.</p>
  <a href="{% url 'login' %}" class="btn">Fazer login</a>
</div>
</body>
</html>
