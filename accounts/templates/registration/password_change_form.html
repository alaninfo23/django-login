<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Alterar Senha</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); width: 100%; max-width: 360px; }
        h2 { margin-bottom: 1.5rem; color: #333; }
        input { width: 100%; padding: .6rem .8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { width: 100%; padding: .7rem; background: #4f46e5; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #4338ca; }
        .error { color: #dc2626; font-size: .85rem; margin-bottom: .5rem; list-style: none; }
        a { color: #4f46e5; font-size: .9rem; display: block; text-align: center; margin-top: 1rem; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>Alterar Senha</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {% for error in field.errors %}
                <p class="error">{{ error }}</p>
            {% endfor %}
            <input type="password" name="{{ field.html_name }}" placeholder="{{ field.label }}" required>
        {% endfor %}
        <button type="submit">Salvar</button>
    </form>
    <a href="{% url 'asset_list' %}">← Voltar</a>
</div>
</body>
</html>
