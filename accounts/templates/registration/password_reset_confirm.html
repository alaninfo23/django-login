{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>SG - Nova Senha</title>
  <link rel="icon" type="image/png" href="{% static 'accounts/logo_pp.png' %}">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;
      background:url("{% static 'accounts/fundo_login.png' %}") center/cover no-repeat;padding:1rem;}
    body::before{content:'';position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:0;}
    .card{position:relative;z-index:1;background:#a1a1a1;padding:2.2rem 2rem;border-radius:14px;
      box-shadow:0 8px 32px rgba(0,0,0,.35);width:100%;max-width:370px;}
    .logo{display:block;width:100%;margin-bottom:.8rem;}
    .tagline{text-align:center;font-size:.78rem;color:#374151;letter-spacing:.06em;text-transform:uppercase;margin-bottom:1rem;}
    h2{font-size:1.1rem;color:#1f2937;margin-bottom:1.2rem;}
    .field{position:relative;margin-bottom:1rem;}
    .field input{width:100%;padding:.65rem .9rem;border:1px solid #d1d5db;border-radius:7px;font-size:.97rem;
      transition:border-color .2s,box-shadow .2s;}
    .field input:focus{outline:none;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15);}
    .toggle-pw{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);
      background:none;border:none;cursor:pointer;color:#6b7280;font-size:1rem;padding:0;}
    button[type=submit]{width:100%;padding:.75rem;background:linear-gradient(135deg,#4f46e5,#7c3aed);
      color:white;border:none;border-radius:7px;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .2s;}
    button[type=submit]:hover{opacity:.9;}
    .error{color:#7f1d1d;font-size:.85rem;margin-bottom:.5rem;}
    .invalid{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:.8rem 1rem;border-radius:7px;}
    a{color:#1f2937;font-size:.9rem;text-decoration:none;font-weight:600;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
<div class="card">
  <img src="{% static 'accounts/logo_pp.png' %}" alt="Logo SG" class="logo"/>
  <p class="tagline">Sistema de Gestão</p>
  <h2>Redefinir Senha</h2>
  {% if validlink %}
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
      <div class="field">
        <input type="password" name="{{ field.html_name }}" placeholder="{{ field.label }}" required id="pw_{{ forloop.counter }}">
        <button type="button" class="toggle-pw" onclick="togglePw('pw_{{ forloop.counter }}')">👁</button>
      </div>
    {% endfor %}
    <button type="submit">Salvar nova senha</button>
  </form>
  {% else %}
  <div class="invalid">Link inválido ou expirado. <a href="{% url 'password_reset' %}">Solicitar novamente</a></div>
  {% endif %}
</div>
<script>
function togglePw(id){const f=document.getElementById(id);f.type=f.type==='password'?'text':'password';}
</script>
</body>
</html>
