<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>E-mail enviado</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); text-align: center; max-width: 360px; }
        h2 { color: #333; margin-bottom: 1rem; }
        p { color: #666; font-size: .9rem; margin-bottom: 1rem; }
        a { color: #4f46e5; text-decoration: none; font-size: .9rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>E-mail enviado! ✉️</h2>
    <p>Se este e-mail estiver cadastrado, você receberá um link para redefinir sua senha em breve.</p>
    <a href="{% url 'login' %}">← Voltar ao login</a>
</div>
</body>
</html>
