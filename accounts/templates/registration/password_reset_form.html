{% load static %}
<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>SG - Redefinir Senha</title>
    <link
      rel="icon"
      type="image/png"
      href="{% static 'accounts/logo_pp.png' %}"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: url("{% static 'accounts/fundo_login.png' %}") center/cover
          no-repeat;
        padding: 1rem;
      }
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: rgba(10, 15, 30, 0.55);
        z-index: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        background: #a1a1a1;
        padding: 2.2rem 2rem;
        border-radius: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
        width: 100%;
        max-width: 370px;
      }
      .logo {
        display: block;
        width: 100%;
        margin-bottom: 0.8rem;
      }
      .tagline {
        text-align: center;
        font-size: 0.78rem;
        color: #374151;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-bottom: 1rem;
      }
      h2 {
        font-size: 1.1rem;
        color: #1f2937;
        margin-bottom: 0.4rem;
      }
      p {
        font-size: 0.88rem;
        color: #374151;
        margin-bottom: 1.2rem;
      }
      input {
        width: 100%;
        padding: 0.65rem 0.9rem;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        font-size: 0.97rem;
        margin-bottom: 1rem;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus {
        outline: none;
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }
      button[type='submit'] {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button[type='submit']:hover {
        opacity: 0.9;
      }
      a {
        display: block;
        text-align: center;
        margin-top: 1rem;
        color: #1f2937;
        font-size: 0.88rem;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        src="{% static 'accounts/logo_pp.png' %}"
        alt="Logo SG"
        class="logo"
      />
      <p class="tagline">Sistema de Gestão da Picos Plast</p>
      <h2>Esqueceu a senha?</h2>
      <p>Informe seu e-mail e enviaremos um link para redefinir sua senha.</p>
      <form method="post">
        {% csrf_token %}
        <input
          type="email"
          name="email"
          placeholder="Seu e-mail"
          required
          autofocus
        />
        <button type="submit">Enviar link</button>
      </form>
      <a href="{% url 'login' %}">← Voltar ao login</a>
    </div>
  </body>
</html>
